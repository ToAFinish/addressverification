<template>
    <lightning-card>
        <div>
             
            <div class="slds-form-element">
                
                <div class="slds-form-element__control">
                    <div class="slds-combobox_container">
                        <template if:true={autocompleteEntries}> 
                            <c-autocomplete-entries search={search} searchtext={searchtext} onselect={getSelected} oncancel={closeSelection}></c-autocomplete-entries>
                        </template>
                        <div class={txtclassname} data-id="resultBox" aria-expanded="false" aria-haspopup="listbox" role="combobox">
                            <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon slds-input-has-icon_left-right" role="none">
                                Country: <lightning-input required={required}  data-id="country" value={country} onchange={handleCountryChange}></lightning-input>
                                Street: <lightning-input required={required} read-only={inputReadOnly} data-id="userinput" label={Label} name="searchText" onkeyup={searchField} value={street} class="leftspace"></lightning-input>
                                <template if:true={isInternational}>
                                    <template if:true={showSpinner}>
                                        <lightning-spinner alternative-text="Loading"></lightning-spinner>
                                    </template>
                                    <template if:true={isDataAvailable}>
                                        <div class="slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open">
                                          <!--  <div class="slds-dropdown slds-dropdown_fluid"> -->
                                                <ul class="slds-dropdown slds-dropdown_fluid">
                                                    <!-- FIRST STEP LIST -->
                                                    <template for:each={interNationalAddresList} for:item="val" for:index="index">
                                                        <li key={val.address_id}
                                                            class="slds-dropdown__item"
                                                            data-index={index}
                                                            style="padding:5px">
                                                            <span style="display:flex;justify-content:space-between;cursor:pointer"
                                                                data-index={index}
                                                                onclick={finalAddressSuggestions}>
                                                                <span class="slds-truncate accolor"
                                                                    title={val.address_text}>
                                                                    {val.address_text}
                                                                </span>
                                                                <span style="color:rgb(5,12,211);font-weight:bold">
                                                                    +{val.entries}-Addresses
                                                                </span>
                                                            </span>
                                                        </li>
                                                    </template>
                                                    <!-- SECOND STEP LIST -->
                                                    <template for:each={interNationalAddresSecondStepList} for:item="val" for:index="index">
                                                        <li key={val.address_id}
                                                            class="slds-dropdown__item"
                                                            data-index={index}
                                                            onclick={finalCompleteAddressSuggestions}
                                                            style="padding:5px">
                                                            <span class="slds-truncate accolor"
                                                                title={val.address_text}>
                                                                {val.address_text}
                                                            </span>
                                                        </li>
                                                    </template>
                                                </ul>
                                            <!--</div> -->
                                        </div>
                                    </template>
                                </template>
                               <template if:false={isInternational}>
                                    <template if:true={isDataAvailable}>  
                                        <div>
                                            <div class="slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open" >
                                                <div class="slds-dropdown slds-dropdown_left">
                                                    <ul  role="menu" aria-label="Show More" >
                                                        <template for:each={searchRecords} for:item="suggestion" for:index="index">
                                                            <li class="slds-dropdown__item" role="presentation" key={suggestion.text} >
                                                                <span class="slds-truncate accolor" style="cursor: pointer;" onclick={useSuggestion}  title={suggestion.text} id={index} >{suggestion.text}</span>
                                                            </li>
                                                        </template>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </template>
                               City: <lightning-input value={city} class="leftspace"></lightning-input> <br/>
                               State: <lightning-input value={state} class="leftspace"></lightning-input> <br/>
                               Zip: <lightning-input value={zip} class="leftspace"></lightning-input> 
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </lightning-card>
</template>
